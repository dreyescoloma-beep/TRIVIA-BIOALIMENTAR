<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trivia en vivo</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef6f0;color:#173126}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border-radius:18px;padding:24px;margin:16px 0;box-shadow:0 10px 30px #17312618}.hide{display:none}h1{text-align:center;color:#176b3a}input{width:100%;padding:14px;margin:7px 0 14px;border:1px solid #cad8ce;border-radius:10px;font-size:16px}button{padding:14px 18px;border:0;border-radius:10px;background:#176b3a;color:#fff;font-weight:bold;cursor:pointer;margin:4px}.secondary{background:#e5f1e8;color:#176b3a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{text-align:left;background:#f1f6f2;color:#173126;min-height:70px}.selected{outline:3px solid #21a35b}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.code{font-size:42px;font-weight:bold;letter-spacing:5px;color:#176b3a}.time{font-size:38px;color:#c43d3d;font-weight:bold}.rank{padding:0;list-style:none}.rank li{display:grid;grid-template-columns:50px 1fr auto;padding:12px;border-bottom:1px solid #e4ebe6;align-items:center}.score{color:#176b3a;font-weight:bold}.status{text-align:center;background:#e7f3ea;padding:14px;border-radius:10px}.bars>div{display:grid;grid-template-columns:35px 1fr 45px;gap:8px;margin:8px 0}.bar{background:#e5ebe7;border-radius:8px;overflow:hidden}.bar span{display:block;height:25px;background:#21a35b}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><h1>Trivia en vivo</h1>
<section id="home" class="card"><h2>Selecciona cómo ingresar</h2><button onclick="show('adminLogin')">Facilitador</button><button class="secondary" onclick="show('playerLogin')">Participante</button></section>
<section id="adminLogin" class="card hide"><h2>Facilitador</h2><input id="password" type="password" placeholder="Clave"><button onclick="createRoom()">Crear sala</button><button class="secondary" onclick="show('home')">Volver</button><small>Clave inicial: 1234</small></section>
<section id="playerLogin" class="card hide"><h2>Participante</h2><input id="roomInput" maxlength="6" placeholder="Código de sala"><input id="nameInput" placeholder="Nombre y apellido"><input id="areaInput" placeholder="Área o equipo"><button onclick="joinRoom()">Ingresar</button><button class="secondary" onclick="show('home')">Volver</button></section>
<section id="admin" class="hide"><div class="card"><div class="row"><div><small>CÓDIGO</small><div id="roomCode" class="code"></div></div><b>Participantes: <span id="playerCount">0</span></b></div><p id="joinLink"></p><button onclick="startGame()">Iniciar trivia</button></div><div id="adminQuestion" class="card hide"><div class="row"><b id="adminProgress"></b><span id="adminTime" class="time"></span></div><h2 id="adminText"></h2><div id="adminOptions" class="grid"></div><p>Respondieron: <b id="answerCount">0</b></p><button onclick="closeQuestion()">Cerrar y mostrar ranking</button></div><div id="adminResult" class="card hide"><h2>Resultados</h2><div id="bars" class="bars"></div><h2>Ranking acumulado</h2><ol id="adminRank" class="rank"></ol><button id="nextBtn" onclick="nextQuestion()">Siguiente</button></div></section>
<section id="player" class="hide"><div class="card row"><b id="playerName"></b><span class="score"><span id="myScore">0</span> puntos</span></div><div id="waiting" class="card status">Registro correcto. Espera al facilitador.</div><div id="playerQuestion" class="card hide"><div class="row"><b id="playerProgress"></b><span id="playerTime" class="time"></span></div><h2 id="playerText"></h2><div id="playerOptions" class="grid"></div><p id="answerStatus" class="status hide"></p></div><div id="playerResult" class="card hide"><p id="feedback" class="status"></p><h2>Ranking</h2><ol id="playerRank" class="rank"></ol></div><div id="playerEnd" class="card hide"><h2>Trivia finalizada</h2><p id="finalScore" class="status"></p><ol id="finalRank" class="rank"></ol></div></section></div>
<script>
const questions=[{text:'¿Cuántos años tiene aproximadamente la Tierra?',options:['4.540 millones','500 millones','10.000 millones','100 millones'],correct:0,time:15},{text:'¿Cuál es la capital de Ecuador?',options:['Guayaquil','Cuenca','Quito','Loja'],correct:2,time:15},{text:'¿Qué planeta es conocido como el planeta rojo?',options:['Venus','Marte','Júpiter','Mercurio'],correct:1,time:15},{text:'¿Cuál es el océano más grande?',options:['Atlántico','Índico','Ártico','Pacífico'],correct:3,time:15}];
let room,id,timer,lastQuestion=-1,answered=false,state=null;const $=x=>document.getElementById(x);const views=['home','adminLogin','playerLogin','admin','player'];function read(){return state}function save(d){state=d;render()}function safe(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(x){views.forEach(v=>$(v).classList.add('hide'));$(x).classList.remove('hide')}
function createRoom(){if($('password').value!=='1234')return alert('Clave incorrecta');room=String(Math.floor(100000+Math.random()*900000));save({state:'lobby',question:-1,players:{},answers:{}});show('admin');$('roomCode').textContent=room;$('joinLink').textContent='Comparte este código con los participantes: '+room;renderAdminLobby()}
function joinRoom(){room=$('roomInput').value.trim();const name=$('nameInput').value.trim(),area=$('areaInput').value.trim(),d=read();if(!/^\d{6}$/.test(room)||!name||!area)return alert('Completa todos los datos');if(!d)return alert('La sala no existe en este navegador');id=Math.random().toString(36).slice(2);d.players[id]={name,area,score:d.players[id]?.score||0};save(d);$('playerName').textContent=name;show('player');render()}
function renderAdminLobby(){const d=read();$('playerCount').textContent=Object.keys(d?.players||{}).length;$('answerCount').textContent=Object.keys(d?.answers||{}).length}function startGame(){publish(0)}function publish(i){const d=read();d.state='question';d.question=i;d.answers={};d.started=Date.now();save(d)}
function countdown(el,n,end){clearInterval(timer);$(el).textContent=n;timer=setInterval(()=>{$(el).textContent=--n;if(n<=0){clearInterval(timer);end&&end()}},1000)}function renderAdminQuestion(d){const i=d.question,q=questions[i];$('adminQuestion').classList.remove('hide');$('adminResult').classList.add('hide');$('adminProgress').textContent='Pregunta '+(i+1)+' de '+questions.length;$('adminText').textContent=q.text;$('adminOptions').innerHTML=q.options.map((o,j)=>'<button class="option">'+('ABCD'[j])+'. '+safe(o)+'</button>').join('');$('answerCount').textContent=Object.keys(d.answers||{}).length;countdown('adminTime',Math.max(0,q.time-Math.floor((Date.now()-d.started)/1000)),closeQuestion)}
function closeQuestion(){clearInterval(timer);const d=read();if(!d||d.state!=='question')return;const q=questions[d.question];Object.entries(d.answers||{}).forEach(([pid,a])=>{if(a.option===q.correct)d.players[pid].score=(d.players[pid].score||0)+Math.max(500,1000-Math.floor(a.delay/25))});d.state='result';save(d)}function rank(el,players){$(el).innerHTML=Object.values(players||{}).sort((a,b)=>(b.score||0)-(a.score||0)).map((p,i)=>'<li><span>'+(['1','2','3'][i]||i+1)+'</span><span><b>'+safe(p.name)+'</b><br><small>'+safe(p.area)+'</small></span><span class="score">'+(p.score||0)+' pts</span></li>').join('')}function renderAdminResult(d){$('adminQuestion').classList.add('hide');$('adminResult').classList.remove('hide');const q=questions[d.question],counts=q.options.map((_,j)=>Object.values(d.answers||{}).filter(a=>a.option===j).length),m=Math.max(1,...counts);$('bars').innerHTML=counts.map((n,j)=>'<div><b>'+('ABCD'[j])+'</b><div class="bar"><span style="width:'+(n/m*100)+'%;background:'+(j===q.correct?'#21a35b':'#8aa197')+'"></span></div><b>'+n+'</b></div>').join('');rank('adminRank',d.players);$('nextBtn').textContent=d.question===questions.length-1?'Finalizar':'Siguiente'}function nextQuestion(){const d=read();d.question+1>=questions.length?(d.state='end',save(d)):publish(d.question+1)}
function setPlayerView(x){['waiting','playerQuestion','playerResult','playerEnd'].forEach(v=>$(v).classList.add('hide'));$(x).classList.remove('hide')}function renderPlayerQuestion(d){if(d.question===lastQuestion)return;lastQuestion=d.question;answered=!!d.answers?.[id];setPlayerView('playerQuestion');const q=questions[d.question];$('playerProgress').textContent='Pregunta '+(d.question+1)+' de '+questions.length;$('playerText').textContent=q.text;$('playerOptions').innerHTML=q.options.map((o,j)=>'<button class="option" onclick="answer('+j+',this)">'+('ABCD'[j])+'. '+safe(o)+'</button>').join('');countdown('playerTime',Math.max(0,q.time-Math.floor((Date.now()-d.started)/1000)),()=>document.querySelectorAll('#playerOptions button').forEach(b=>b.disabled=true))}function answer(option,btn){if(answered)return;answered=true;document.querySelectorAll('#playerOptions button').forEach(b=>b.disabled=true);btn.classList.add('selected');const d=read();d.answers[id]={option,delay:Math.max(0,Date.now()-d.started)};save(d);$('answerStatus').textContent='Respuesta registrada';$('answerStatus').classList.remove('hide')}function renderPlayerResult(d){clearInterval(timer);setPlayerView('playerResult');const q=questions[d.question],a=d.answers?.[id];$('feedback').innerHTML=a?.option===q.correct?'Correcto: <b>'+safe(q.options[q.correct])+'</b>':'Respuesta correcta: <b>'+safe(q.options[q.correct])+'</b>';rank('playerRank',d.players)}function renderPlayerEnd(d){setPlayerView('playerEnd');$('finalScore').textContent='Puntaje final: '+(d.players?.[id]?.score||0);rank('finalRank',d.players)}function render(){const d=read();if(!d)return;if(!id){renderAdminLobby();if(d.state==='question')renderAdminQuestion(d);if(d.state==='result')renderAdminResult(d);return}$('myScore').textContent=d.players?.[id]?.score||0;if(d.state==='lobby')setPlayerView('waiting');if(d.state==='question')renderPlayerQuestion(d);if(d.state==='result')renderPlayerResult(d);if(d.state==='end')renderPlayerEnd(d)}
</script></body></html>
